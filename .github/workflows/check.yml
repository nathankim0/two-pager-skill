name: Check two-pager
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/two-pager/scripts/requirements.txt
      - run: python -m pip install -r skills/two-pager/scripts/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-failure
          path: output/test-failure
